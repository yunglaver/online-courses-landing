<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="assets/main.css">
    <script src="scripts/index.js" defer type="module"></script>
    <title>Online courses</title>
</head>
<body>
    <header>
        <div class="section-title">
            <span class="section-title__meta">ENJOY YOUR STUDYING!</span>
            <h2 class="section-title__main">Our online courses</h2>
        </div>

    </header>
    <nav>
        <div class="category-buttons">
            <button class="category-button active" data-category="All">
                <span class="category-title">All</span>
                <span class="category-count" id="category-all__count"></span>
            </button>

            <button class="category-button" data-category="Marketing">
                <span class="category-title">Marketing</span>
                <span class="category-count" id="category-marketing__count"></span>
            </button>

            <button class="category-button" data-category="Management">
                <span class="category-title">Management</span>
                <span class="category-count" id="category-management__count"></span>
            </button>

            <button class="category-button" data-category="HR & Recruting">
                <span class="category-title">HR & Recruting</span>
                <span class="category-count" id="category-hr__count"></span>
            </button>

            <button class="category-button" data-category="Design">
                <span class="category-title">Design</span>
                <span class="category-count" id="category-design__count"></span>
            </button>

            <button class="category-button" data-category="Development">
                <span class="category-title">Development</span>
                <span class="category-count" id="category-development__count"></span>
            </button>
        </div>

        <form class="search-form">
            <input
                placeholder="Search course..."
                class="search-form__input"
                id="search-form__input"
                autocomplete="off"
            >
            <img src="assets/icons/search.svg" alt="search">
        </form>
    </nav>
    <main>
        <img class="decor decor-dots" src="assets/icons/dots-right.svg" alt="decor">
        <img class="decor decor-left" src="assets/icons/decor-left.svg" alt="decor">
        <img class="decor decor-right" src="assets/icons/decor-right.svg" alt="decor">
        <div class="courses"></div>
    </main>
    <footer>
        <button class="load-more__button">
            <img class="load-more__icon" src="assets/icons/load-more.svg" alt="load-more">
            <span class="load-more__title">Load more</span>
        </button>
    </footer>
</body>
</html>
